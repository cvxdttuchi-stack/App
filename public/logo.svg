<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1470"/>
      <stop offset="0.45" stop-color="#5b2bb8"/>
      <stop offset="0.72" stop-color="#7c3aed"/>
      <stop offset="0.9" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#f0b429"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- rounded-square base -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- subtle inner highlight -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>
  <!-- bold white V letterform -->
  <path d="M150 150 L256 370 L362 150"
        fill="none" stroke="#ffffff" stroke-width="64"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- heart accent, top-right of the V, gold-pink #ff5d7e -->
  <path d="M362 92
           c-10-22 -40-24 -50-4
           c-10-20 -40-18 -50 4
           c-8 18 14 44 50 68
           c36-24 58-50 50-68 z"
        fill="#ff5d7e" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <!-- thin inner border for premium edge -->
  <rect x="10" y="10" width="492" height="492" rx="104"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
</svg>
